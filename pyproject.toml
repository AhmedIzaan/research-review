[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "literature-grounded-research-review"
version = "0.1.0"
description = "Controlled research ideation with specialized reviewing and auditable literature evidence"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.12,<3", "python-dotenv>=1.2,<2"]

[project.optional-dependencies]
web = ["fastapi>=0.129,<1", "uvicorn>=0.41,<1", "httpx>=0.28,<1"]
experiments = ["langgraph>=1.0,<2", "pandas>=2.2,<4", "matplotlib>=3.9,<4", "seaborn>=0.13,<1", "scipy>=1.14,<2", "nbformat>=5.10,<6", "nbclient>=0.10,<1", "ipykernel>=6.29,<8"]
test = ["pytest>=8,<10", "fastapi>=0.129,<1", "httpx>=0.28,<1"]

[project.scripts]
research-review = "research_review.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
